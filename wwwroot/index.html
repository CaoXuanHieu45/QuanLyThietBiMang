<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý thiết bị mạng</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header><div><h1>Quản lý thiết bị mạng</h1><p>Theo dõi thiết bị và địa điểm lắp đặt</p></div><button class="primary" id="addButton">+ Thêm thiết bị</button></header>
  <main>
    <div id="message" role="status"></div>
    <section class="stats">
      <div class="card"><span>Tổng thiết bị</span><strong id="totalCount">—</strong></div>
      <div class="card"><span>Đang hoạt động</span><strong id="onlineCount">—</strong></div>
      <div class="card"><span>Đang ngoại tuyến</span><strong id="offlineCount">—</strong></div>
    </section>
    <section class="panel">
      <div class="toolbar"><div><h2>Danh sách thiết bị</h2><p>Thông tin được tải từ cơ sở dữ liệu</p></div><button class="secondary" id="refreshButton">Làm mới</button></div>
      <div class="filters"><select id="siteFilter"><option value="">Tất cả địa điểm</option></select><input id="searchInput" type="search" placeholder="Tìm theo tên hoặc địa chỉ IP"></div>
      <div class="table-wrap"><table><thead><tr><th>STT</th><th>Tên thiết bị</th><th>Địa chỉ IP</th><th>Địa điểm</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="deviceRows"></tbody></table><div class="empty" id="emptyState" hidden>Không có thiết bị phù hợp.</div></div>
    </section>
  </main>
  <dialog id="deviceDialog">
    <form id="deviceForm">
      <div class="form-head"><h2 id="formTitle">Thêm thiết bị</h2><button type="button" class="secondary" id="closeButton" aria-label="Đóng">✕</button></div>
      <div class="form-body">
        <input type="hidden" id="deviceId">
        <label>Tên thiết bị<input id="deviceName" required maxlength="150" placeholder="Ví dụ: Router tầng 1"></label>
        <label>Địa chỉ IP<input id="deviceIp" required placeholder="192.168.1.1"></label>
        <label>Địa điểm<select id="deviceSite" required></select></label>
        <label>Trạng thái<select id="deviceStatus"><option>Online</option><option>Offline</option></select></label>
      </div>
      <div class="form-actions"><button type="button" class="secondary" id="cancelButton">Hủy</button><button class="primary" type="submit">Lưu thiết bị</button></div>
    </form>
  </dialog>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
